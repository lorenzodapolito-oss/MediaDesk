[package]
name = "mediadesk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MediaDesk: audio tagger/player/converter and batch video converter (ffmpeg front end)"
build = "build.rs"

[features]
default = ["playback"]
# Audio output through rodio (needs the ALSA dev files on Linux; always available on Windows/macOS).
playback = ["dep:rodio"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
ureq = { version = "3", features = ["json"] }
trash = "5"
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "symphonia-all"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
